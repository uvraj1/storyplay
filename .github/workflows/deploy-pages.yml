name: Deploy StoryPlay UI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check UI folder exists
        run: |
          if [ ! -f "www/index.html" ]; then
            echo "::error::www/index.html nahi mila. Pehle StoryPlay ka static UI www/ folder me rakho (storyplay-android ka www/)."
            exit 1
          fi
          echo "UI mil gaya: www/index.html"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
