# StoryPlay — Android APK build (GitHub Actions)
name: Build StoryPlay APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Play Store ke liye Release AAB bhi banao (signing secrets chahiye)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Sync Capacitor web assets to Android
        run: npx cap sync android
      - name: Decrypt signing keystore
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in android/app/storyplay-release.keystore.enc -out android/app/storyplay-release.keystore -pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=$PWD/app/storyplay-release.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: storyplay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: StoryPlay Latest APK
          body: "StoryPlay ki latest APK — app ke andar se auto-update ke liye."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
  build-aab:
    name: Release AAB (Play Store)
    runs-on: ubuntu-latest
    needs: build-debug
    if: ${{ github.event.inputs.build_aab == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Sync Capacitor web assets to Android
        run: npx cap sync android
      - name: Decode release keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/storyplay-release.keystore
      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace -Pandroid.injected.signing.store.file=$PWD/app/storyplay-release.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: storyplay-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
